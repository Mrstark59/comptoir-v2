<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — LTD Grove Street</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">
      <span class="logo-badge">LTD</span>
      <span class="logo-text">Admin</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">← Retour au site</a></li>
    </ul>
  </nav>

  <section class="section">
    <h2>Ajouter un article</h2>
    <form id="form" class="admin-form">
      <input type="text" id="nom" placeholder="Nom de l'article" required>
      <input type="number" step="0.01" id="prix" placeholder="Prix (ex: 2.50)" required>
      <input type="text" id="categorie" placeholder="Catégorie (ex: Boissons)" required>
      <button type="submit" class="btn">Ajouter</button>
    </form>
    <h2 style="margin-top:3rem">Articles actuels</h2>
    <div id="adminList"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    async function list() {
      const { data } = await supabase.from("articles").select("*").order("id");
      document.getElementById("adminList").innerHTML = (data || []).map(a => `
        <div class="card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center">
          <span><strong>${a.nom}</strong> — ${a.categorie} — ${Number(a.prix).toFixed(2)} $</span>
          <button class="btn-reset" onclick="del(${a.id})">Supprimer</button>
        </div>`).join("") || "<p>Aucun article.</p>";
    }

    document.getElementById("form").addEventListener("submit", async e => {
      e.preventDefault();
      await supabase.from("articles").insert({
        nom: document.getElementById("nom").value,
        prix: parseFloat(document.getElementById("prix").value),
        categorie: document.getElementById("categorie").value
      });
      e.target.reset();
      list();
    });

    async function del(id) {
      if (confirm("Supprimer cet article ?")) {
        await supabase.from("articles").delete().eq("id", id);
        list();
      }
    }

    list();
  </script>
</body>
</html>
